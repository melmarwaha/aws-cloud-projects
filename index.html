<h1>Melkeet Marwaha - Cloud & Network Security Portfolio</h1>
<p class="visitor-counter">
  👀 Visitor Count: <span id="counter">Loading...</span>
</p>
<script>
  const apiUrl = 'https://wc313susdh.execute-api.eu-west-2.amazonaws.com/get';

  async function updateVisitorCount() {
    try {
      const response = await fetch(apiUrl);
      const data = await response.json();
      document.getElementById('counter').innerText = data.views;
    } catch (error) {
      console.error('Error fetching visitor count:', error);
      document.getElementById('counter').innerText = '1';
    }
  }

  updateVisitorCount();
</script>
